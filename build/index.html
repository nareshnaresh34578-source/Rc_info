<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vehicle Finder v2.0</title>

<style>
body{
background:#000;
color:#00ff88;
font-family:Arial;
text-align:center;
}

.container{
width:90%;
max-width:700px;
margin:auto;
margin-top:50px;
padding:20px;
background:#111;
border:2px solid #00ff88;
border-radius:10px;
box-shadow:0 0 20px #00ff88;
}

input{
width:80%;
padding:12px;
font-size:18px;
background:#000;
color:#00ff88;
border:1px solid #00ff88;
}

button{
padding:12px 20px;
background:#00ff88;
color:black;
font-size:18px;
border:none;
cursor:pointer;
margin-top:15px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

td{
border:1px solid #00ff88;
padding:10px;
}

h1{
color:#00ffff;
}
</style>

</head>

<body>

<div class="container">

<h1>🚗 Vehicle Registration Finder v2.0</h1>

<form method="POST">
<input type="text" name="rc" placeholder="Enter RC Number" required>
<br>
<button type="submit">Search</button>
</form>

{% if error %}
<h3 style="color:red">{{ error }}</h3>
{% endif %}

{% if result and result.details %}

<table>

{% for key,value in result.details.items() %}

{% if value and value != "NA" %}

<tr>
<td><b>{{ key }}</b></td>
<td>{{ value }}</td>
</tr>

{% endif %}

{% endfor %}

</table>

{% endif %}

</div>

</body>
</html>
